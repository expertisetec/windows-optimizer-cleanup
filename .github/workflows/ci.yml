name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sintaxe - Windows PowerShell 5.1 (motor alvo do script)
        shell: powershell
        run: |
          $errors = $null
          foreach ($file in Get-ChildItem -Path . -Include *.ps1 -Recurse) {
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
              foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)" }
              if ($errors.Count -gt 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Testes (Pester)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path ./tests -CI
